openapi: 3.0.1
info:
  title: SRE Alert Ingestion Service API
  version: 1.0.0
  description: >
    Ingests normalized alerts from external monitoring/alerting tools and
    turns each into a platform incident. Every accepted alert is durably
    buffered before any delivery attempt is made, retried with backoff on
    failure, and escalated via an independent voice-call channel if delivery
    keeps failing — so this service is never a single point of failure on
    the platform's own availability. Deployed with no gateway/ingress auth
    layer in front of it, so it authenticates every inbound request itself
    via HTTP Basic Auth, one username/password pair per alert source.
security:
  - basicAuth: []
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Liveness/readiness check — reports whether the buffer database is reachable.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ok
        "503":
          description: Buffer database unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts:
    post:
      summary: Submit a normalized alert for incident creation.
      description: >
        Validates and durably persists the alert before responding — no
        delivery attempt is made inline. A background worker retries
        delivery with exponential backoff and escalates via an independent
        notification channel once the retry budget is exhausted. The
        returned id identifies the buffered alert, not a platform incident
        (no incident may exist yet, or ever, depending on how delivery
        resolves).
      operationId: createAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRequest'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "400":
          description: BadRequest — missing a required field, or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/azure:
    post:
      summary: Submit an Azure Monitor common-alert-schema webhook payload.
      description: >
        Translates Azure Monitor's own native webhook body into this
        service's generic AlertRequest, then reuses the exact same
        validation/buffering/worker/grouping/dedup/escalation path as
        POST /alerts. Additive to that generic endpoint, not a replacement
        for it.
      operationId: createAlertFromAzure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureAlertPayload'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "400":
          description: BadRequest — missing a required field, or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/aws:
    post:
      summary: Submit an AWS SNS-wrapped CloudWatch alarm notification.
      description: >
        Auto-confirms an SNS SubscriptionConfirmation/UnsubscribeConfirmation
        handshake message without creating an alert from either. A
        Notification message's own Message field carries the CloudWatch
        alarm as a JSON string, translated into this service's generic
        AlertRequest and enqueued via the exact same
        validation/buffering/worker/grouping/dedup/escalation path as
        POST /alerts.
      operationId: createAlertFromAWS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AWSSNSEnvelope'
      responses:
        "200":
          description: SNS control message (subscription/unsubscribe confirmation) handled; no alert created.
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "400":
          description: BadRequest — missing a required field, or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/gcp:
    post:
      summary: Submit a GCP Cloud Monitoring webhook notification.
      description: >
        Translates GCP Cloud Monitoring's own native webhook body into this
        service's generic AlertRequest, then reuses the exact same
        validation/buffering/worker/grouping/dedup/escalation path as
        POST /alerts.
      operationId: createAlertFromGCP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GCPAlertPayload'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "400":
          description: BadRequest — missing a required field, or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/elasticsearch:
    post:
      summary: Submit a Kibana Webhook connector action payload.
      description: >
        Translates a Kibana rule's Webhook connector action body into this
        service's generic AlertRequest, then reuses the exact same
        validation/buffering/worker/grouping/dedup/escalation path as
        POST /alerts.
      operationId: createAlertFromElasticsearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElasticsearchAlertPayload'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "400":
          description: BadRequest — missing a required field, or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/icinga2:
    post:
      summary: Submit an Icinga2 NotificationCommand payload.
      description: >
        Translates an Icinga2 NotificationCommand payload into this
        service's generic AlertRequest, then reuses the exact same
        validation/buffering/worker/grouping/dedup/escalation path as
        POST /alerts.
      operationId: createAlertFromIcinga2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Icinga2AlertPayload'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "400":
          description: BadRequest — missing a required field, or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/site24x7:
    post:
      summary: Submit a Site24x7 native alert-webhook payload.
      description: >
        Translates Site24x7's own native webhook body into this service's
        generic AlertRequest. Only STATUS values TROUBLE/DOWN/CRITICAL
        create a buffered alert; any other STATUS returns 200 with a small
        acknowledgment body (the payload is valid, it is simply not a
        status this integration acts on).
      operationId: createAlertFromSite24x7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site24x7AlertPayload'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "200":
          description: Recognized but ignored — STATUS is not TROUBLE/DOWN/CRITICAL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgnoredResponse'
        "400":
          description: BadRequest — malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/opensearch:
    post:
      summary: Submit an OpenSearch (Choreo path) native alert payload.
      description: >
        Translates this source's own native alert body into this service's
        generic AlertRequest, then reuses the exact same
        validation/buffering/worker/grouping/dedup/escalation path as
        POST /alerts.
      operationId: createAlertFromOpenSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSearchAlertPayload'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "400":
          description: BadRequest — malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/adapters/grafana:
    post:
      summary: Submit a Grafana native alert-webhook payload.
      description: >
        Translates Grafana's own native webhook body into this service's
        generic AlertRequest. Only state == "alerting" creates a buffered
        alert; any other state returns 200 with a small acknowledgment body
        (a non-alerting webhook is not an incident-creation trigger).
      operationId: createAlertFromGrafana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrafanaAlertPayload'
      responses:
        "202":
          description: Alert accepted and durably buffered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcceptedResponse'
        "200":
          description: Recognized but ignored — state is not "alerting".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgnoredResponse'
        "400":
          description: BadRequest — malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >
        One username/password pair per alert source, configured via the
        SRE_ALERT_AUTH_USERS environment variable (bcrypt-hashed at rest).
        See README.md's Authentication section.

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    AlertRequest:
      type: object
      required:
        - source
        - severity
        - service
        - metricName
        - description
      properties:
        source:
          type: string
          description: >
            The originating monitoring/alerting tool (e.g. "azure",
            "site24x7", "grafana", "datadog", "prometheus"). Recognized
            values map to an existing incident contact-type; unrecognized
            values are accepted and simply omit that mapping.
        severity:
          type: string
          description: >
            One of "critical", "major", "minor", "warning", "ok" (case
            insensitive). An unrecognized value maps to the same
            classification as "ok" — see README.md's severity mapping table.
        service:
          type: string
          description: The affected service, mapped to the created incident's serviceId.
        metricName:
          type: string
        category:
          type: string
          description: >
            One of "INQUIRY", "SERVICE_INTERRUPTION", "SECURITY" (case
            insensitive, optional). Defaults to "SERVICE_INTERRUPTION" when
            omitted or unrecognized.
        environment:
          type: string
        uniqueIdentifier:
          type: string
          description: The source tool's own identifier for this alert, if any.
        description:
          type: string

    AlertAcceptedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The buffered alert's internal id (not a platform incident id).
        alertNumber:
          type: string
          description: >
            This service's own human-readable alert number (e.g. "ALT0000123"),
            distinct from id — see internal/store.Store.Enqueue's doc comment.

    IgnoredResponse:
      type: object
      description: >
        Returned when a vendor-adapter route recognized the payload as
        well-formed but not one this integration acts on (e.g. a Site24x7
        STATUS other than TROUBLE/DOWN/CRITICAL, or a Grafana state other
        than "alerting") — the alert is neither buffered nor an error.
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [ignored]
        reason:
          type: string

    AzureAlertPayload:
      type: object
      description: >
        Azure Monitor's own common-alert-schema webhook body, modeled to
        only the fields this adapter reads — not an exhaustive schema of
        everything Azure Monitor can send.
      properties:
        data:
          type: object
          properties:
            essentials:
              type: object
              properties:
                alertId:
                  type: string
                alertRule:
                  type: string
                severity:
                  type: string
                  description: One of "Sev0".."Sev4".
                monitorCondition:
                  type: string
                  description: '"Fired" or "Resolved".'
                monitoringService:
                  type: string
            alertContext:
              type: object
              description: Vendor-specific nested object, rendered into Description as-is.

    AWSSNSEnvelope:
      type: object
      description: >
        AWS SNS's own message envelope. Type distinguishes a real alarm
        notification from the two control messages SNS itself sends.
      properties:
        Type:
          type: string
          description: '"SubscriptionConfirmation", "UnsubscribeConfirmation", or "Notification".'
        MessageId:
          type: string
        SubscribeURL:
          type: string
          description: Present only on a SubscriptionConfirmation message; GETed to auto-confirm the subscription.
        Message:
          type: string
          description: >
            The CloudWatch alarm as a JSON string (not a nested object —
            SNS's own wire format). Its own AlarmDescription field carries
            a second, nested JSON string with service/severity/category/
            environment, since CloudWatch alarms have no native
            custom-fields mechanism.

    GCPAlertPayload:
      type: object
      description: >
        GCP Cloud Monitoring's own incident webhook notification body,
        modeled to only the fields this adapter reads.
      properties:
        incident:
          type: object
          properties:
            incident_id:
              type: string
            condition_name:
              type: string
            state:
              type: string
              description: '"open" or "closed".'
            severity:
              type: string
              description: One of "critical", "error", "warning", "info".
            summary:
              type: string
            url:
              type: string
            policy_user_labels:
              type: object
              additionalProperties:
                type: string
              description: Operator-configured labels (service/category/environment).

    ElasticsearchAlertPayload:
      type: object
      description: >
        A Kibana rule's Webhook connector action body, modeled to only the
        fields this adapter reads.
      properties:
        rule_name:
          type: string
        state:
          type: string
          description: '"ACTIVE", "COMPLETED", or "ERROR".'
        alert_id:
          type: string
          description: Used as the unique identifier matching ACTIVE/COMPLETED states of the same alert.
        severity:
          type: string
          description: Numeric string "1".."5", only consulted when state is ACTIVE.
        service:
          type: string
        environment:
          type: string
        category:
          type: string

    Icinga2AlertPayload:
      type: object
      description: >
        Icinga2's own NotificationCommand payload, modeled to only the
        fields this adapter reads. A single shape covers both host-level and
        service-level notifications.
      properties:
        notification_type:
          type: string
          description: '"Problem", "Acknowledgement", or "Recovery".'
        host_name:
          type: string
        host_state:
          type: string
          description: '"UP", "DOWN", or "UNREACHABLE".'
        service_name:
          type: string
          description: Empty for a host-level notification.
        service_state:
          type: string
          description: '"OK", "WARNING", "CRITICAL", or "UNKNOWN".'
        service_output:
          type: string
        vars:
          type: object
          properties:
            environment:
              type: string
            service:
              type: string
            category:
              type: string

    Site24x7AlertPayload:
      type: object
      description: Site24x7's own native alert-webhook body.
      properties:
        STATUS:
          type: string
          description: >
            One of "TROUBLE", "DOWN", "CRITICAL" (actionable, case
            sensitive) or any other value (recognized but ignored).
        MONITORNAME:
          type: string
        MONITOR_ID:
          type: string
        INCIDENT_REASON:
          type: string
        INCIDENT_DETAILS:
          type: string

    OpenSearchAlertPayload:
      type: object
      description: >
        This source's own native alert body. Note: its "source" field is a
        human-readable title, not the originating system's identity — it is
        mapped to AlertRequest.metricName, not AlertRequest.source (which is
        always the fixed literal "opensearch").
      properties:
        source:
          type: string
          description: Human-readable title of what fired.
        description:
          type: string
        timestamp:
          type: string
        severity:
          type: string
          description: >
            One of "critical", "urgent", "warning", "low", "informational",
            or any other/missing value (maps to this service's "ok").

    GrafanaAlertPayload:
      type: object
      description: Grafana's own native alert-webhook body.
      properties:
        state:
          type: string
          description: Only "alerting" is actionable; any other value is ignored.
        title:
          type: string
        tags:
          type: object
          properties:
            service:
              type: string
              description: Free text, passed through as-is to AlertRequest.service.
            severity:
              type: string
              description: One of "1".."4", or any other/missing value (maps to "ok").
